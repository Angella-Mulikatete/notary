[package]
name = "notary"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
globset = "0.4.20"
hex = "0.4.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
wait-timeout = "0.2.1"
